# ==============================================================================
# TMUX CONFIGURATION - OPTIMIZED FOR GHOSTTY + NEOVIM + AI AGENT
# ==============================================================================

set -g extended-keys on

# ------------------------------------------------------------------------------
# 1. Prefix Key
# ------------------------------------------------------------------------------
# Ubah prefix dari C-b menjadi C-a (lebih ergonomis di keyboard Mac)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ------------------------------------------------------------------------------
# 2. General Settings & Neovim Responsiveness
# ------------------------------------------------------------------------------
# Nol delay saat menekan ESC (sangat penting untuk Neovim modal editing)
set -s escape-time 0

# Tingkatkan history scrollback
set -g history-limit 50000

# Extended keyboard protocols
set -g extended-keys-format csi-u

# Aktifkan mouse (klik untuk fokus, resize, scroll)
set -g mouse on

# Auto renumber windows saat ada window yang ditutup
set -g renumber-windows on

# Indeks window & pane dimulai dari 1 (lebih mudah dijangkau di angka keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Deteksi fokus jendela untuk Neovim
set -g focus-events on

# Reload tmux configuration dengan prefix + r
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# ------------------------------------------------------------------------------
# 3. Terminal Colors & Ghostty / Kitty Graphics Passthrough
# ------------------------------------------------------------------------------
# True color (RGB) support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",ghostty:RGB"

# Kitty Image Protocol & Terminal Escape Passthrough
# Wajib aktif agar Ghostty bisa merender gambar (yazi, image.nvim, chafa)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ------------------------------------------------------------------------------
# 4. Intuitive Window & Pane Navigation
# ------------------------------------------------------------------------------
# Split pane horizontal (|) dan vertikal (-) mempertahankan path direktori aktif
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Seamless navigation antara Neovim splits & Tmux panes (kompatibel vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Resize pane dengan Alt + Arrow keys
bind -n M-Left  resize-pane -L 3
bind -n M-Right resize-pane -R 3
bind -n M-Up    resize-pane -U 3
bind -n M-Down  resize-pane -D 3

# ------------------------------------------------------------------------------
# 5. Vi Mode & macOS Clipboard (OSC 52 / pbcopy)
# ------------------------------------------------------------------------------
setw -g mode-keys vi
set -s set-clipboard on

# Copy mode bindings ala Vim
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# ------------------------------------------------------------------------------
# 6. Clean & Minimalist Status Bar
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[fg=#11111b,bg=#89b4fa,bold] #S #[bg=default] "

set -g status-right-length 80
set -g status-right "#[fg=#a6adc8,bg=#181825] %H:%M #[fg=#11111b,bg=#a6e3a1,bold] #h "

setw -g window-status-format "#[fg=#6c7086,bg=#181825] #I:#W "
setw -g window-status-current-format "#[fg=#cdd6f4,bg=#313244,bold] #I:#W "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
